<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="trophyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd84d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background decorations -->
  <circle cx="520" cy="330" r="130" fill="#f59e0b" opacity=".12"/>
  <circle cx="80" cy="70" r="110" fill="#ec4899" opacity=".1"/>
  <circle cx="300" cy="50" r="100" fill="#6c5cff" opacity=".12"/>
  
  <!-- Trophy -->
  <g transform="translate(180, 140)">
    <!-- Base -->
    <rect x="40" y="190" width="120" height="14" rx="7" fill="#d8d4f2"/>
    <rect x="55" y="178" width="90" height="16" rx="8" fill="#c7c3e6"/>
    
    <!-- Cup base -->
    <path d="M50 160 Q60 170 80 170 Q100 170 110 160 L110 130 Q110 110 90 100 Q70 110 50 130 Z" fill="url(#trophyGrad)" filter="url(#glow)"/>
    
    <!-- Cup rim -->
    <path d="M45 130 Q55 120 85 120 Q115 120 125 130 L125 120 Q115 110 85 110 Q55 110 45 120 Z" fill="#c7c3e6"/>
    
    <!-- Cup handle -->
    <path d="M45 140 Q30 140 25 150 Q25 165 45 165" fill="none" stroke="#c7c3e6" stroke-width="4" stroke-linecap="round"/>
    <path d="M115 140 Q130 140 140 150 Q140 165 115 165" fill="none" stroke="#c7c3e6" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Shine -->
    <path d="M60 145 Q75 135 90 145" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  </g>
  
  <!-- Floating badges -->
  <g transform="translate(340, 180)">
    <circle cx="0" cy="0" r="34" fill="#ec4899" opacity=".2"/>
    <rect x="-24" y="-24" width="48" height="48" rx="12" fill="#ffffff" stroke="#f0abfc" stroke-width="1"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ec4899" text-anchor="middle">G</text>
    <text x="0" y="28" font-family="system-ui, sans-serif" font-size="11" fill="#15132e" text-anchor="middle" opacity=".8">First</text>
    <text x="0" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#15132e" text-anchor="middle" opacity=".8">Steps</text>
  </g>
  
  <g transform="translate(440, 240)">
    <circle cx="0" cy="0" r="30" fill="#22c6e8" opacity=".2"/>
    <rect x="-20" y="-20" width="40" height="40" rx="10" fill="#ffffff" stroke="#67e8f9" stroke-width="1"/>
    <path d="M-8 -4 L8 -4 L0 8 Z" fill="#22c6e8"/>
    <text x="0" y="30" font-family="system-ui, sans-serif" font-size="10" fill="#15132e" text-anchor="middle" opacity=".8">Focus</text>
  </g>
  
  <g transform="translate(260, 280)">
    <circle cx="0" cy="0" r="28" fill="#f59e0b" opacity=".2"/>
    <rect x="-18" y="-18" width="36" height="36" rx="9" fill="#ffffff" stroke="#fdba74" stroke-width="1"/>
    <path d="M-6 -2 L6 -2 L0 6 Z" fill="#f59e0b"/>
    <text x="0" y="26" font-family="system-ui, sans-serif" font-size="9" fill="#15132e" text-anchor="middle" opacity=".8">Night</text>
  </g>
  
  <!-- Sparkles -->
  <g fill="#ffffff" opacity=".9">
    <circle cx="420" cy="120" r="3"/>
    <circle cx="520" cy="200" r="4"/>
    <circle cx="380" cy="320" r="3"/>
    <circle cx="200" cy="60" r="4"/>
    <circle cx="50" cy="260" r="3"/>
  </g>
</svg>
