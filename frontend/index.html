<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="description" content="Prism AI turns any topic or photo of your notes into playable, adaptive lessons." />
    <meta name="theme-color" content="#0b0a1a" />
    <link rel="icon" type="image/svg+xml" href="/prism-logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prism AI" />
    <title>Prism AI — learn anything, play your way</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Set the theme before React loads so there is no light/dark flash.
      try {
        var s = JSON.parse(localStorage.getItem('prism_settings') || '{}');
        var d = typeof s.darkMode === 'boolean' ? s.darkMode : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
